name: Facebook auto-post
on:
  schedule:
    - cron: "0 4 * * *"    # + random delay up to 90 min
    - cron: "0 11 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency: fb-post
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python post.py
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NICHE: ${{ vars.NICHE }}
          PAGE_NAME: ${{ vars.PAGE_NAME }}
      - name: Save history
        run: |
          git config user.name "bot"; git config user.email "bot@users.noreply.github.com"
          git add history.json; git commit -m "update history" || true; git push
